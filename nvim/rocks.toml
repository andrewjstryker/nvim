# rocks.toml -- canonical plugin manifest
#
# Key format:
#   - Luarocks packages:  "package-name" = "version"
#   - Git-only plugins:   [plugins.short-name] with git = "owner/repo"
#
# The build system (rocks_sync.lua) reads this file directly via toml-edit.
# Plugin installation is handled entirely by `make sync`.

[rocks]
# Non-Neovim Lua rocks (leave empty unless you add pure-Lua deps)

[plugins]

# --- search / pickers (plenary must be in the main [plugins] table) ---
"plenary.nvim"      = "scm"

# --- sensible defaults ---
[plugins.vim-sensible]
git = "tpope/vim-sensible"

# --- git ---
[plugins.gitsigns.nvim]
git = "lewis6991/gitsigns.nvim"

[plugins.vim-fugitive]
git = "tpope/vim-fugitive"

# --- motions / editing ---
[plugins.leap.nvim]
git = "https://codeberg.org/andyg/leap.nvim"

[plugins.nvim-surround]
git = "kylechui/nvim-surround"

[plugins.Comment.nvim]
git = "numToStr/Comment.nvim"

[plugins.nvim-autopairs]
git = "windwp/nvim-autopairs"

[plugins.which-key.nvim]
git = "folke/which-key.nvim"

[plugins.nvim-lastplace]
git = "ethanholz/nvim-lastplace"

# --- diagnostics UX ---
[plugins.trouble.nvim]
git = "folke/trouble.nvim"

# --- encryption ---
[plugins.vim-gnupg]
git = "jamessan/vim-gnupg"

# --- completion (LSP + buffer + path + copilot integration) ---
[plugins.nvim-cmp]
git = "hrsh7th/nvim-cmp"

[plugins.cmp-nvim-lsp]
git = "hrsh7th/cmp-nvim-lsp"

[plugins.cmp-buffer]
git = "hrsh7th/cmp-buffer"

[plugins.cmp-path]
git = "hrsh7th/cmp-path"

# --- formatting (black/ruff, styler, sql-formatter, prettier) ---
[plugins.conform.nvim]
git = "stevearc/conform.nvim"

# --- SQL ---
[plugins.vim-dadbod]
git = "tpope/vim-dadbod"

[plugins.vim-dadbod-ui]
git = "kristijanhusak/vim-dadbod-ui"

[plugins.vim-dadbod-completion]
git = "kristijanhusak/vim-dadbod-completion"

# --- Markdown rendering (in-buffer headings, tables, code blocks) ---
# opt=true: loaded via autocmd only when treesitter markdown parser exists
[plugins.render-markdown.nvim]
git = "MeanderingProgrammer/render-markdown.nvim"
opt = true

# --- languages / syntax (optional, loaded on demand) ---
[plugins.Nvim-R]
git = "jalvesaq/Nvim-R"
opt = true

[plugins.csv.vim]
git = "chrisbra/csv.vim"
opt = true

[plugins.vim-ledger]
git = "ledger/vim-ledger"
opt = true

[plugins.dockerfile.vim]
git = "ekalinin/dockerfile.vim"
opt = true

[plugins.vim-pandoc-syntax]
git = "vim-pandoc/vim-pandoc-syntax"
opt = true

# --- Theme / UI ---
[plugins.vim-solarized8]
git = "andrewjstryker/vim-solarized8"

[plugins.nvim-web-devicons]
git = "nvim-tree/nvim-web-devicons"

[plugins.lualine.nvim]
git = "nvim-lualine/lualine.nvim"

# --- file browser (edit-the-filesystem-as-a-buffer) ---
[plugins.oil.nvim]
git = "stevearc/oil.nvim"

# --- search / pickers ---
[plugins.telescope.nvim]
git = "nvim-telescope/telescope.nvim"

# --- Treesitter & LSP ---
# nvim-treesitter's default branch (`main`) is the v1.0 rewrite with a
# completely different API (no nvim-treesitter.configs, no :TSInstall).
# Our config uses the legacy stable API on `master`.
[plugins.nvim-treesitter]
git = "nvim-treesitter/nvim-treesitter"
branch = "master"

[plugins.nvim-lspconfig]
git = "neovim/nvim-lspconfig"

# --- AI completion ---
# Pinned to the v3.0.0 tag. Uses server.type = "binary" (standalone
# copilot-language-server, no host Node.js) — configured in
# lua/plugins/completion.lua. Pin so a future sync can't silently swap the
# server backend or plugin API. NOTE: `branch` is how rocks_sync.lua pins a
# ref — its `git clone --branch` accepts tags, so this checks out the v3.0.0
# tag (not a branch).
[plugins.copilot.lua]
git = "zbirenbaum/copilot.lua"
branch = "v3.0.0"

# --- Writing / focus ---
[plugins.zen-mode.nvim]
git = "folke/zen-mode.nvim"

# --- Tmux ---
[plugins.nvim-tmux-navigation]
git = "alexghergh/nvim-tmux-navigation"

# wiki-style notes (render-markdown.nvim covers Markdown blogging better):
[plugins.vimwiki]
git = "vimwiki/vimwiki"
opt = true

# unicode table lookup (niche):
[plugins.unicode.vim]
git = "chrisbra/unicode.vim"
opt = true

# --- commented out: enable if/when needed ---

# indent guides (more useful for deeply nested JS/YAML than Python/R):
# [plugins.indent-blankline.nvim]
# git = "lukas-reineke/indent-blankline.nvim"


