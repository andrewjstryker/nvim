# rocks.toml -- canonical plugin manifest for rocks.nvim
#
# Key format:
#   - Luarocks packages:  "package-name" = "version"
#   - Git-only plugins:   [plugins.short-name] with git = "owner/repo"
#
# rocks-git.nvim handles the [plugins.X] git entries via :Rocks sync.
# rocks-config.nvim auto-loads per-plugin configs from lua/plugins/*.lua.

[rocks]
# Non-Neovim Lua rocks (leave empty unless you add pure-Lua deps)

[plugins]

# --- plugin managers / helpers (also seeded as submodules for first boot) ---
"rocks.nvim"        = "2.47.4"
"rocks-git.nvim"    = "scm"
"rocks-config.nvim" = "scm"

# --- sensible defaults ---
[plugins.vim-sensible]
git = "tpope/vim-sensible"

# --- git ---
[plugins.gitsigns.nvim]
git = "lewis6991/gitsigns.nvim"

[plugins.vim-fugitive]
git = "tpope/vim-fugitive"

# --- motions / editing ---
[plugins.leap.nvim]
git = "ggandor/leap.nvim"

[plugins.nvim-surround]
git = "kylechui/nvim-surround"

[plugins.Comment.nvim]
git = "numToStr/Comment.nvim"

[plugins.nvim-autopairs]
git = "windwp/nvim-autopairs"

[plugins.which-key.nvim]
git = "folke/which-key.nvim"

[plugins.nvim-lastplace]
git = "ethanholz/nvim-lastplace"

# --- diagnostics UX ---
[plugins.trouble.nvim]
git = "folke/trouble.nvim"

# --- encryption ---
[plugins.vim-gnupg]
git = "jamessan/vim-gnupg"

# --- languages / syntax (optional, loaded on demand) ---
[plugins.Nvim-R]
git = "jalvesaq/Nvim-R"
opt = true

[plugins.csv.vim]
git = "chrisbra/csv.vim"
opt = true

[plugins.vim-ledger]
git = "ledger/vim-ledger"
opt = true

[plugins.dockerfile.vim]
git = "ekalinin/dockerfile.vim"
opt = true

[plugins.vim-pandoc-syntax]
git = "vim-pandoc/vim-pandoc-syntax"
opt = true

[plugins.vimwiki]
git = "vimwiki/vimwiki"
opt = true

[plugins.unicode.vim]
git = "chrisbra/unicode.vim"
opt = true

[plugins.nvim-jqx]
git = "gennaro-tedesco/nvim-jqx"
opt = true

